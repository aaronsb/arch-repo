name: check upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Nothing in this file names a package. Adding one means adding a directory
# under PKGBUILDs with an `upstream` script in it; this workflow discovers it.
#
# The per-package contract:
#
#   upstream        required to be watched. Runs with cwd set to the package
#                   directory. Prints nothing when already current; prints
#                   current=, current_rel=, version= and pkgrel= and rewrites
#                   the PKGBUILD when not.
#   notes           optional. Run as `notes <current> <new>`; stdout is appended
#                   to the pull request body. Only consulted when the version
#                   moved — upstream has no changelog for a repackaging.
#   .no-auto-merge  optional. Its presence means the PR waits for a human even
#                   when the build is green.
jobs:
  # create-pull-request opens the PR as whoever owns the token it is given.
  # Under the default GITHUB_TOKEN, GitHub suppresses the resulting
  # pull_request event to stop workflows recursing, so build.yml never runs,
  # the PR carries no checks, and --auto has nothing to wait for. A user token
  # makes the PR ordinary.
  #
  # Failing outright on a missing secret, rather than falling back to
  # GITHUB_TOKEN, is the point. The degraded path still looks like it works —
  # PRs appear, they merge — while the verification quietly stopped happening.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the bump token
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          test -n "$BUMP_PAT" || {
            echo "::error::BUMP_PAT is unset; a bump PR opened without it would carry no checks."
            exit 1
          }

  discover:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.list.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          pkgs=$(find PKGBUILDs -mindepth 2 -maxdepth 2 -name upstream -type f \
                 | xargs -r -n1 dirname | xargs -r -n1 basename | sort \
                 | jq -R . | jq -sc .)
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "watching: $pkgs"

  bump:
    needs: [preflight, discover]
    if: needs.discover.outputs.pkgs != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One upstream being unreachable is no reason to stop watching the rest.
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.pkgs) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # The script's own stdout is already key=value, so it is the step output
      # verbatim. Printing nothing leaves version unset, and every step below
      # is guarded on it.
      - name: Resolve upstream
        id: up
        working-directory: PKGBUILDs/${{ matrix.pkg }}
        run: ./upstream >> "$GITHUB_OUTPUT"

      - name: Collect release notes
        id: notes
        if: steps.up.outputs.version && steps.up.outputs.version != steps.up.outputs.current
        working-directory: PKGBUILDs/${{ matrix.pkg }}
        env:
          CUR: ${{ steps.up.outputs.current }}
          NEW: ${{ steps.up.outputs.version }}
        run: |
          [ -x ./notes ] || exit 0
          ./notes "$CUR" "$NEW" > /tmp/notes.md || exit 0
          test -s /tmp/notes.md || exit 0
          D="notes-$(openssl rand -hex 8)"
          {
            echo "body<<$D"
            grep -v "^$D\$" /tmp/notes.md
            echo "$D"
          } >> "$GITHUB_OUTPUT"

      # Everything names the full pkgver-pkgrel, which is the only form that is
      # unique. Two successive repackagings of one release are both "1.2.0", and
      # under the old naming the second would have reopened the first one's
      # branch and merged a stale recipe under a title that looked right.
      - name: Open PR
        id: pr
        if: steps.up.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_PAT }}
          branch: bump/${{ matrix.pkg }}-${{ steps.up.outputs.version }}-${{ steps.up.outputs.pkgrel }}
          delete-branch: true
          title: "${{ matrix.pkg }} ${{ steps.up.outputs.version }}-${{ steps.up.outputs.pkgrel }}"
          commit-message: "${{ matrix.pkg }}: ${{ steps.up.outputs.current }}-${{ steps.up.outputs.current_rel }} -> ${{ steps.up.outputs.version }}-${{ steps.up.outputs.pkgrel }}"
          body: |
            ${{ steps.up.outputs.version == steps.up.outputs.current
                && format('The recipe for `{0}` changed in its source repository with no new release behind it, so the same upstream code is repackaged as `{0}-{1}`.', steps.up.outputs.version, steps.up.outputs.pkgrel)
                || format('Upstream published `{0}`, replacing `{1}`.', steps.up.outputs.version, steps.up.outputs.current) }}
            The build re-runs whatever verification this package's PKGBUILD
            performs, so CI fails if the values below are wrong.

            ${{ steps.notes.outputs.body }}

      # A package opts out by carrying .no-auto-merge — for a proprietary blob,
      # or a codebase whose PKGBUILD holds version-specific build workarounds,
      # "the build passed" is not the same as "this should ship".
      - name: Queue the merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if [ -e "PKGBUILDs/${{ matrix.pkg }}/.no-auto-merge" ]; then
            echo "::notice::#$PR left for review; ${{ matrix.pkg }} opts out of auto-merge"
            exit 0
          fi
          gh pr merge --auto --merge "$PR"
