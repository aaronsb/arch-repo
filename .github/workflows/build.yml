name: build and publish

on:
  push:
    branches: [main]
    paths: ['PKGBUILDs/**', '.github/workflows/build.yml']
  # Deliberately unfiltered, unlike the push trigger above. These two build jobs
  # are main's required status checks, and a path filter skips the whole
  # workflow rather than reporting a passing context — so a PR that touches no
  # PKGBUILD would produce no checks and could never satisfy the branch rule.
  # A minute of redundant build on doc-only PRs buys a gate that always reports.
  pull_request:
  workflow_dispatch:

env:
  REPO_NAME: aaronsb

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: [ya-claude, ya-claude-code]
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed namcap git

      # makepkg refuses to run as root, and the container's default user is root.
      # -s below has it install dependencies, which needs passwordless sudo.
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # -s is kept deliberately: nothing here needs a dependency at build time,
      # but resolving them proves every name in depends() exists in the repos,
      # which is the failure a hand-assembled list actually has.
      - name: Build
        working-directory: PKGBUILDs/${{ matrix.pkg }}
        run: |
          sudo -u builder makepkg -sf --noconfirm

      # Errors a package knowingly accepts are listed as regexes in its own
      # .namcap-allow, with the reason in the PKGBUILD. Anything else fails.
      - name: Lint
        working-directory: PKGBUILDs/${{ matrix.pkg }}
        run: |
          namcap ./*.pkg.tar.zst | tee namcap.txt
          if [ -f .namcap-allow ]; then
            unexpected=$(grep ' E: ' namcap.txt | grep -vE -f .namcap-allow || true)
          else
            unexpected=$(grep ' E: ' namcap.txt || true)
          fi
          if [ -n "$unexpected" ]; then
            echo "::error::namcap reported an unexpected error"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.pkg }}
          path: PKGBUILDs/${{ matrix.pkg }}/*.pkg.tar.zst
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # git is not a gh dependency but gh release shells out to it.
      - run: pacman -Syu --noconfirm --needed github-cli git

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Import repo signing key
        env:
          KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}' > /tmp/fpr

      # pacman fetches <repo>.db and <repo>.files by those exact names, but
      # repo-add writes .db.tar.gz with a symlink alongside. GitHub release
      # assets can't be symlinks, so both names are uploaded as real files.
      - name: Assemble and sign the repository
        run: |
          mkdir -p repo && cp artifacts/*.pkg.tar.zst repo/
          cd repo
          FPR=$(cat /tmp/fpr)

          for p in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor -u "$FPR" "$p"
          done

          repo-add --sign --key "$FPR" "${REPO_NAME}.db.tar.gz" ./*.pkg.tar.zst

          # repo-add leaves <repo>.db as a symlink to <repo>.db.tar.gz, so these
          # have to replace the link rather than write through it.
          for ext in db files; do
            cp --remove-destination "${REPO_NAME}.${ext}.tar.gz"     "${REPO_NAME}.${ext}"
            cp --remove-destination "${REPO_NAME}.${ext}.tar.gz.sig" "${REPO_NAME}.${ext}.sig"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          # -R keeps gh from inferring the target from git metadata, which the
          # container's checkout does not always have.
          gh release delete repo -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create repo -R "$GITHUB_REPOSITORY" \
            --title "pacman repository" \
            --notes "Rolling release. Add to pacman.conf; see the README." \
            ./*

  # The AUR carries the same recipe for people outside this fleet. It is pushed
  # only after the package has actually built and published here, so a broken
  # PKGBUILD cannot reach it.
  aur:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      - run: pacman -Syu --noconfirm --needed git openssh

      # Kept as one step with absolute paths: HOME is not stable across container
      # steps here, so credentials written in one step are not necessarily
      # visible in the next.
      - name: Push if the version moved
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -dm700 /tmp/aur-ssh
          printf '%s\n' "$AUR_SSH_KEY" > /tmp/aur-ssh/key
          chmod 600 /tmp/aur-ssh/key
          ssh-keyscan aur.archlinux.org > /tmp/aur-ssh/known_hosts 2>/dev/null
          test -s /tmp/aur-ssh/known_hosts   # empty means the scan silently failed
          export GIT_SSH_COMMAND="ssh -i /tmp/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/aur-ssh/known_hosts"

          # The AUR answers an unregistered key with a bare "Permission denied
          # (publickey)" that names neither the key it saw nor the account it
          # looked under, which is indistinguishable from a malformed secret.
          # The public half of a private key is not itself a secret, so printing
          # its fingerprint costs nothing and turns that into a value to compare
          # against the keys listed on aur.archlinux.org/account.
          echo "offering $(ssh-keygen -lf /tmp/aur-ssh/key)"

          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

          git clone -q ssh://aur@aur.archlinux.org/ya-claude.git /tmp/aur
          cp PKGBUILDs/ya-claude/PKGBUILD PKGBUILDs/ya-claude/anthropic-release-signing.key /tmp/aur/
          chown -R builder:builder /tmp/aur

          # makepkg will not run as root, and --printsrcinfo is still makepkg.
          cd /tmp/aur
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          if git diff --quiet; then
            echo "AUR already matches; nothing to push"
            exit 0
          fi

          VER=$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)
          git config user.name  'Aaron Bockelie'
          git config user.email 'aaronsb@gmail.com'
          git add PKGBUILD .SRCINFO anthropic-release-signing.key
          git commit -qm "ya-claude ${VER}"
          git push origin HEAD:refs/heads/master
