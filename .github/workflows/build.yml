name: build and publish

on:
  push:
    branches: [main]
    paths: ['PKGBUILDs/**', '.github/workflows/build.yml']
  # Deliberately unfiltered, unlike the push trigger above. The gate below is
  # main's required status check, and a path filter skips the whole workflow
  # rather than reporting a passing context — so a PR that touches no PKGBUILD
  # would produce no checks and could never satisfy the branch rule. A minute of
  # redundant build on doc-only PRs buys a gate that always reports.
  pull_request:
  workflow_dispatch:

env:
  REPO_NAME: aaronsb

jobs:
  # The package list is read from the tree rather than written here, so adding a
  # package is adding a directory. Keeping it in the workflow meant every new
  # package touched a file whose job names are branch-protection contexts.
  discover:
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.list.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          pkgs=$(find PKGBUILDs -mindepth 2 -maxdepth 2 -name PKGBUILD -type f \
                 | xargs -r -n1 dirname | xargs -r -n1 basename | sort \
                 | jq -R . | jq -sc .)
          test "$pkgs" != "[]"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "building: $pkgs"

  build:
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.pkgs) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed namcap git

      # makepkg refuses to run as root, and the container's default user is root.
      # -s below has it install dependencies, which needs passwordless sudo.
      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # -s is kept deliberately: nothing here needs a dependency at build time,
      # but resolving them proves every name in depends() exists in the repos,
      # which is the failure a hand-assembled list actually has.
      - name: Build
        working-directory: PKGBUILDs/${{ matrix.pkg }}
        run: |
          sudo -u builder makepkg -sf --noconfirm

      # Errors a package knowingly accepts are listed as regexes in its own
      # .namcap-allow, with the reason in the PKGBUILD. Anything else fails.
      #
      # Debug packages are excluded rather than allowlisted. makepkg generates
      # them, and every .build-id entry in one is a symlink to a path that lives
      # in the main package, so namcap reports the whole set as dangling — sixty
      # errors that say nothing about the PKGBUILD. Allowlisting them per package
      # would mean each package that ships debug output carries the same block of
      # regexes to silence a fact about how makepkg splits packages.
      - name: Lint
        working-directory: PKGBUILDs/${{ matrix.pkg }}
        run: |
          pkgs=$(ls ./*.pkg.tar.zst | grep -v -- '-debug-')
          namcap $pkgs | tee namcap.txt
          if [ -f .namcap-allow ]; then
            unexpected=$(grep ' E: ' namcap.txt | grep -vE -f .namcap-allow || true)
          else
            unexpected=$(grep ' E: ' namcap.txt || true)
          fi
          if [ -n "$unexpected" ]; then
            echo "::error::namcap reported an unexpected error"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      # Debug packages are built but not shipped. Arch keeps them in a separate
      # repository precisely because they are large and almost nobody installs
      # them; folding them into a single-repository pacman feed would put the
      # symbols in front of everyone who adds it.
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.pkg }}
          path: |
            PKGBUILDs/${{ matrix.pkg }}/*.pkg.tar.zst
            !PKGBUILDs/${{ matrix.pkg }}/*-debug-*.pkg.tar.zst
          retention-days: 7

  # One check name that does not change when packages come and go. Branch
  # protection names its required contexts as strings, so requiring the matrix
  # legs directly meant every added package silently arrived ungated: its job
  # was not in the required list, and a rule listing a departed package's job
  # can never be satisfied at all.
  gate:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every package to have built
        run: |
          echo "discover=${{ needs.discover.result }} build=${{ needs.build.result }}"
          # A matrix result is the aggregate of its legs, so one failed package
          # fails this. Cancelled and skipped are failures here too — neither
          # means the packages built.
          test "${{ needs.discover.result }}" = success
          test "${{ needs.build.result }}"    = success

  publish:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Two bumps merging minutes apart is the normal case now that they merge
    # themselves, and this job deletes the release before recreating it. Run
    # twice at once, one run's delete lands after the other's create and the
    # pacman repository disappears until something else pushes.
    #
    # Scoped to this job rather than the workflow so PR builds still run in
    # parallel. cancel-in-progress is false because the destructive window is
    # mid-job: killing a run between the delete and the upload is the outcome
    # being avoided. GitHub keeps only one run pending per group, so a third
    # merge discards the middle one — harmless here, since each run rebuilds
    # and uploads every package rather than appending to what is there.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # git is not a gh dependency but gh release shells out to it.
      - run: pacman -Syu --noconfirm --needed github-cli git

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Import repo signing key
        env:
          KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}' > /tmp/fpr

      # pacman fetches <repo>.db and <repo>.files by those exact names, but
      # repo-add writes .db.tar.gz with a symlink alongside. GitHub release
      # assets can't be symlinks, so both names are uploaded as real files.
      - name: Assemble and sign the repository
        run: |
          mkdir -p repo && cp artifacts/*.pkg.tar.zst repo/
          cd repo
          FPR=$(cat /tmp/fpr)

          for p in *.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor -u "$FPR" "$p"
          done

          repo-add --sign --key "$FPR" "${REPO_NAME}.db.tar.gz" ./*.pkg.tar.zst

          # repo-add leaves <repo>.db as a symlink to <repo>.db.tar.gz, so these
          # have to replace the link rather than write through it.
          for ext in db files; do
            cp --remove-destination "${REPO_NAME}.${ext}.tar.gz"     "${REPO_NAME}.${ext}"
            cp --remove-destination "${REPO_NAME}.${ext}.tar.gz.sig" "${REPO_NAME}.${ext}.sig"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          # -R keeps gh from inferring the target from git metadata, which the
          # container's checkout does not always have.
          gh release delete repo -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create repo -R "$GITHUB_REPOSITORY" \
            --title "pacman repository" \
            --notes "Rolling release. Add to pacman.conf; see the README." \
            ./*

  # The AUR carries the same recipes for people outside this fleet. They are
  # pushed only after the package has actually built and published here, so a
  # broken PKGBUILD cannot reach it.
  aur:
    # discover is already upstream of publish; it is named again only to bring
    # its output into scope here.
    needs: [discover, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      # One package failing to reach the AUR is no reason to withhold the other.
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.pkgs) }}
    # Same reasoning against a shared ref: two runs cloning, committing and
    # pushing the same AUR master concurrently means the loser is rejected as
    # non-fast-forward, and the bump it carried is simply lost. Keyed by package
    # because the contention is over one AUR repository, not the AUR at large —
    # the two packages have no reason to queue behind each other.
    concurrency:
      group: publish-aur-${{ matrix.pkg }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      - run: pacman -Syu --noconfirm --needed git openssh

      # Kept as one step with absolute paths: HOME is not stable across container
      # steps here, so credentials written in one step are not necessarily
      # visible in the next.
      - name: Push if the version moved
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          PKG: ${{ matrix.pkg }}
        run: |
          install -dm700 /tmp/aur-ssh
          printf '%s\n' "$AUR_SSH_KEY" > /tmp/aur-ssh/key
          chmod 600 /tmp/aur-ssh/key
          ssh-keyscan aur.archlinux.org > /tmp/aur-ssh/known_hosts 2>/dev/null
          test -s /tmp/aur-ssh/known_hosts   # empty means the scan silently failed
          export GIT_SSH_COMMAND="ssh -i /tmp/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/aur-ssh/known_hosts"

          # The AUR answers an unregistered key with a bare "Permission denied
          # (publickey)" that names neither the key it saw nor the account it
          # looked under, which is indistinguishable from a malformed secret.
          # The public half of a private key is not itself a secret, so printing
          # its fingerprint costs nothing and turns that into a value to compare
          # against the keys listed on aur.archlinux.org/account.
          echo "offering $(ssh-keygen -lf /tmp/aur-ssh/key)"

          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

          # A package the AUR does not carry yet clones as an empty repository
          # rather than failing, and the first push is what creates it.
          git clone -q "ssh://aur@aur.archlinux.org/${PKG}.git" /tmp/aur

          # What goes to the AUR is the package, not this repository's tooling.
          # Taking the tracked files and subtracting the four CI-only names is
          # the only version of this that stays correct as packages are added:
          # the previous list was literally PKGBUILD plus the Claude signing key,
          # so the first package without that key failed on a missing file, and
          # any package with an .install or a bundled licence would have shipped
          # to the AUR without it.
          files=$(git -C "$GITHUB_WORKSPACE" ls-files "PKGBUILDs/${PKG}" \
                  | xargs -n1 basename \
                  | grep -vxE 'upstream|notes|\.no-auto-merge|\.namcap-allow')
          test -n "$files"
          for f in $files; do cp "PKGBUILDs/${PKG}/$f" /tmp/aur/; done
          chown -R builder:builder /tmp/aur

          # makepkg will not run as root, and --printsrcinfo is still makepkg.
          cd /tmp/aur
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          git config user.name  'Aaron Bockelie'
          git config user.email 'aaronsb@gmail.com'
          git add $files .SRCINFO

          # Staged rather than working-tree diff. In the empty repository of a
          # package the AUR does not carry yet, every file is untracked, and
          # untracked files are invisible to `git diff` — the check would report
          # no change and the package would never be created. Against the empty
          # tree the staged diff is the whole package, which is correct.
          if git diff --cached --quiet; then
            echo "AUR already matches ${PKG}; nothing to push"
            exit 0
          fi

          VER=$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)
          git commit -qm "${PKG} ${VER}"
          git push origin HEAD:refs/heads/master
