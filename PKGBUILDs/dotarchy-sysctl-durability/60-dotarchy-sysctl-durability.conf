# dotarchy-sysctl-durability — silent hard locks become clean reboots.
# Rationale: /usr/share/doc/dotarchy-sysctl-durability/why.md
# Override: same filename in /etc/sysctl.d/ masks this file.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.hung_task_panic = 1
kernel.panic = 10
kernel.panic_on_io_nmi = 1
kernel.sysrq = 1
